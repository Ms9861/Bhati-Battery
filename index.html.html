<!DOCTYPE html>
      <label>Amount</label>
      <input type="number" id="amount" required min="1" placeholder="Enter amount">
    </div>

    <button type="submit" class="submit-btn">Submit Registration</button>

    <div id="status"></div>

  </form>

  <div class="footer">
    © 2026 BHATI BATTERY • Professional Registration System
  </div>

</div>

<script>

const scriptURL = 'https://script.google.com/macros/s/AKfycbzijd1IVZ8O6LMvk4un5ZbzgYKkFrT51HBo_tqfo7KCzknSZ-HU8XnMx-iK0JtMdBxj/exec';

const form = document.getElementById('registrationForm');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const data = {
    customerName: document.getElementById('customerName').value,
    batteryModel: document.getElementById('batteryModel').value,
    mobile: document.getElementById('mobile').value,
    date: document.getElementById('date').value,
    amount: document.getElementById('amount').value
  };

  try {
    const response = await fetch(scriptURL, {
      method: 'POST',
      body: JSON.stringify(data)
    });

    const result = await response.json();

    document.getElementById('status').innerHTML = result.message;

    form.reset();

  } catch (error) {
    document.getElementById('status').innerHTML = 'Error submitting form';
  }
});

</script>

</body>
</html>
