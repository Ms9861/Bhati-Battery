<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BHATI BATTERY Dashboard</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background:
        linear-gradient(rgba(15,23,42,0.78), rgba(15,23,42,0.78)),
        url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=1600&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      color: #1f2937;
    }

    .navbar {
      width: 100%;
      padding: 18px 30px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: 700;
      font-size: 20px;
      box-shadow: 0 10px 20px rgba(37,99,235,0.25);
    }

    .logo h1 {
      font-size: 28px;
      background: linear-gradient(90deg, #2563eb, #1d4ed8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-buttons {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .nav-btn {
      padding: 12px 20px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s ease;
      box-shadow: 0 8px 18px rgba(37,99,235,0.2);
    }

    .nav-btn:hover {
      transform: translateY(-2px);
    }

    .page {
      display: none;
      padding: 35px 20px;
    }

    .active {
      display: block;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    .card {
      background: rgba(255,255,255,0.96);
      border-radius: 28px;
      padding: 32px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.08);
      border: 1px solid rgba(37,99,235,0.12);
    }

    .title {
      text-align: center;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #1d4ed8;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 30px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
      gap: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid #d1d5db;
      font-size: 15px;
      transition: 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37,99,235,0.15);
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      margin-top: 24px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
    }

    #status {
      text-align: center;
      margin-top: 18px;
      color: #2563eb;
      font-weight: 600;
    }

    .toolbar {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .toolbar input,
    .toolbar select {
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid #d1d5db;
      min-width: 220px;
      flex: 1;
    }

    .table-container {
      overflow-x: auto;
      border-radius: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      overflow: hidden;
      border-radius: 20px;
    }

    th {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      padding: 16px;
      text-align: left;
      font-size: 14px;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid #eef2ff;
      font-size: 14px;
    }

    tr:hover {
      background: #eff6ff;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-box {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      padding: 28px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(37,99,235,0.22);
    }

    .stat-box h3 {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .stat-box p {
      font-size: 30px;
      font-weight: 700;
    }

    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        gap: 16px;
      }

      .nav-buttons {
        width: 100%;
        justify-content: center;
      }

      .card {
        padding: 24px 18px;
      }

      .title {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>

<div class="navbar">
  <div class="logo">
    <div class="logo-circle">
      <svg width="30" height="30" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="18" width="40" height="28" rx="4" fill="white"/>
        <rect x="50" y="26" width="4" height="12" rx="1" fill="white"/>
        <path d="M30 22L22 34H30L26 42L40 28H32L36 22H30Z" fill="#2563EB"/>
      </svg>
    </div>
    <h1>BHATI BATTERY</h1>
  </div>

  <div class="nav-buttons">
    <button class="nav-btn" onclick="showPage('registerPage')">Registration</button>
    <button class="nav-btn" onclick="showPage('recordsPage'); loadData();">Customer Records</button>
  </div>
</div>

<div id="registerPage" class="page active">
  <div class="container">
    <div class="card" style="backdrop-filter: blur(14px); background: rgba(255,255,255,0.92);">

      <h2 class="title">Battery Registration Details</h2>
      <p class="subtitle">Professional Customer Registration Panel</p>

      <form id="registrationForm">

        <div class="form-grid">

          <div class="form-group">
            <label>Customer Name</label>
            <input type="text" id="customerName" required>
          </div>

          <div class="form-group">
            <label>Battery Model</label>
            <input type="text" id="batteryModel" required>
          </div>

          <div class="form-group">
            <label>Mobile Number</label>
            <input type="tel" id="mobile" pattern="[0-9]{10}" maxlength="10" required>
          </div>

          <div class="form-group">
            <label>Date</label>
            <input type="date" id="date" required>
          </div>

          <div class="form-group">
            <label>Amount</label>
            <input type="number" id="amount" min="1" required>
          </div>

        </div>

        <button type="submit" class="submit-btn">Submit Registration</button>

        <div id="status"></div>

      </form>

    </div>
  </div>
</div>

<div id="recordsPage" class="page">
  <div class="container">

    <div class="stats" style="margin-top:10px;">
      <div class="stat-box">
        <h3>Total Customers</h3>
        <p id="totalCustomers">0</p>
      </div>

      <div class="stat-box">
        <h3>Total Amount</h3>
        <p id="totalAmount">₹0</p>
      </div>
    </div>

    <div class="card" style="backdrop-filter: blur(14px); background: rgba(255,255,255,0.92);">

      <h2 class="title">Registered Customer Details</h2>
      <p class="subtitle">Search, Sort and View Customer Data</p>

      <div class="toolbar">
        <input type="text" id="searchInput" placeholder="Search customer, mobile or model..." onkeyup="searchTable()">

        <select id="sortSelect" onchange="sortTable()">
          <option value="default">Sort Data</option>
          <option value="name">Customer Name</option>
          <option value="amount">Amount</option>
        </select>
      </div>

      <div class="table-container">
        <table id="dataTable">
          <thead>
            <tr>
              <th>Customer Name</th>
              <th>Battery Model</th>
              <th>Mobile Number</th>
              <th>Date</th>
              <th>Amount</th>
            </tr>
          </thead>

          <tbody id="tableBody"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<script>


const scriptURL = 'https://script.google.com/macros/s/AKfycbx6tWFZfpTJ33GGFLXd1yfGP1JOAiu8nKuYq_IWM8mJUu2fVgU6XwjJ1RrbGX8nxlH5/exec';

function showPage(pageId) {
  document.querySelectorAll('.page').forEach(page => {
    page.classList.remove('active');
  });

  document.getElementById(pageId).classList.add('active');
}

const form = document.getElementById('registrationForm');

form.addEventListener('submit', async (e) => {

  e.preventDefault();

  const status = document.getElementById('status');

  status.innerHTML = 'Submitting...';

  const data = {
    action: 'add',
    customerName: document.getElementById('customerName').value,
    batteryModel: document.getElementById('batteryModel').value,
    mobile: document.getElementById('mobile').value,
    date: document.getElementById('date').value,
    amount: document.getElementById('amount').value
  };

  try {

    const response = await fetch(scriptURL, {
      method: 'POST',
      mode: 'cors',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8',
      },
      body: JSON.stringify(data)
    });

    const result = await response.json();

    status.innerHTML = result.message;

    form.reset();

  } catch(error) {

    status.innerHTML = 'Connection Failed';
  }
});

async function loadData() {

  try {

    const response = await fetch(scriptURL + '?action=get');

    const data = await response.json();

    const tableBody = document.getElementById('tableBody');

    tableBody.innerHTML = '';

    let totalAmount = 0;

    data.forEach(row => {

      totalAmount += Number(row.amount);

      tableBody.innerHTML += `
        <tr>
          <td>${row.customerName}</td>
          <td>${row.batteryModel}</td>
          <td>${row.mobile}</td>
          <td>${row.date}</td>
          <td>₹${row.amount}</td>
        </tr>
      `;
    });

    document.getElementById('totalCustomers').innerHTML = data.length;
    document.getElementById('totalAmount').innerHTML = '₹' + totalAmount;

  } catch(error) {
    console.log(error);
  }
}

function searchTable() {

  const input = document.getElementById('searchInput').value.toLowerCase();
  const rows = document.querySelectorAll('#tableBody tr');

  rows.forEach(row => {

    const text = row.innerText.toLowerCase();

    row.style.display = text.includes(input) ? '' : 'none';
  });
}

function sortTable() {

  const sortValue = document.getElementById('sortSelect').value;

  const tbody = document.getElementById('tableBody');

  const rows = Array.from(tbody.querySelectorAll('tr'));

  rows.sort((a, b) => {

    if(sortValue === 'name') {
      return a.cells[0].innerText.localeCompare(b.cells[0].innerText);
    }

    if(sortValue === 'amount') {
      return parseInt(a.cells[4].innerText.replace('₹','')) - parseInt(b.cells[4].innerText.replace('₹',''));
    }

    return 0;
  });

  tbody.innerHTML = '';

  rows.forEach(row => tbody.appendChild(row));
}

</script>

</body>
</html>
